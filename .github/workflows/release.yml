name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Check the tag matches the CLI version
        run: test "v$(node -p 'require("./packages/cli/package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          pnpm --filter @lovelace/cli deploy --prod --legacy "$RUNNER_TEMP/lovelace"
          find "$RUNNER_TEMP/lovelace" -type f \( -name '*.map' -o -name '*.d.ts' \) -delete
          tar -czf "lovelace-$version.tar.gz" -C "$RUNNER_TEMP/lovelace" .
          shasum -a 256 "lovelace-$version.tar.gz" | tee "lovelace-$version.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lovelace-*.tar.gz* --verify-tag --generate-notes --title "Lovelace $GITHUB_REF_NAME"
